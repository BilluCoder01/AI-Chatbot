<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aster — AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ DESIGN TOKENS ============ */
  :root{
    --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  /* Dark theme (default) — deep indigo/plum "study at dusk" */
  html[data-theme="dark"]{
    --bg:#14151f; --bg-alt:#191b28; --surface:#1e2032; --surface-hover:#262941;
    --border:#2c2f47; --text:#e9e7f2; --text-muted:#9a9bb5; --text-faint:#6b6c86;
    --accent:#8b85ff; --accent-soft:#8b85ff22; --accent-text:#100e2a;
    --accent2:#4fd8b0; --danger:#ff7b7b;
    --user-bubble:#3a3564; --assistant-bubble:#1e2032;
    --shadow:0 10px 40px -12px rgba(0,0,0,.5);
  }
  /* Light theme — warm paper, not cream/terracotta */
  html[data-theme="light"]{
    --bg:#f6f4f1; --bg-alt:#efece6; --surface:#ffffff; --surface-hover:#f1eee8;
    --border:#e2ded4; --text:#211f2e; --text-muted:#6b6878; --text-faint:#9b98a8;
    --accent:#5b52d6; --accent-soft:#5b52d61a; --accent-text:#ffffff;
    --accent2:#1f9c78; --danger:#c4453f;
    --user-bubble:#5b52d6; --assistant-bubble:#ffffff;
    --shadow:0 10px 30px -14px rgba(50,40,20,.18);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ============ APP SHELL ============ */
  .app-shell{ display:flex; height:100vh; }

  /* ============ SIDEBAR ============ */
  .sidebar{
    width:272px; flex-shrink:0; background:var(--bg-alt);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    transition:margin-left .28s var(--ease), box-shadow .28s var(--ease);
  }
  .sidebar-brand{
    display:flex; align-items:center; gap:10px;
    padding:20px 18px 14px;
  }
  .brand-mark{
    width:30px; height:30px; border-radius:9px;
    background:linear-gradient(155deg, var(--accent), var(--accent2));
    position:relative; flex-shrink:0;
  }
  .brand-mark::after{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.55), transparent 55%);
  }
  .brand-name{ font-family:var(--font-display); font-style:italic; font-size:1.28rem; font-weight:500; letter-spacing:.2px; }

  .new-chat-btn{
    margin:6px 14px 12px; padding:10px 14px;
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); font-size:.88rem; font-weight:600;
    color:var(--text); transition:background .18s var(--ease), transform .12s var(--ease), border-color .18s;
  }
  .new-chat-btn:hover{ background:var(--surface-hover); border-color:var(--accent); }
  .new-chat-btn:active{ transform:scale(.97); }

  .history-label{
    font-size:.7rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--text-faint); padding:14px 18px 6px; font-weight:600;
  }
  .history-list{ flex:1; overflow-y:auto; padding:0 10px; display:flex; flex-direction:column; gap:2px; }
  .history-item{
    display:flex; align-items:center; gap:9px;
    padding:9px 10px; border-radius:var(--radius-sm);
    font-size:.85rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:background .16s var(--ease), color .16s var(--ease);
  }
  .history-item svg{ flex-shrink:0; opacity:.7; }
  .history-item:hover{ background:var(--surface-hover); color:var(--text); }
  .history-item.active{ background:var(--accent-soft); color:var(--text); }

  .sidebar-footer{
    border-top:1px solid var(--border); padding:12px;
    display:flex; align-items:center; gap:10px;
  }
  .settings-btn{
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius-sm); color:var(--text-muted);
    transition:background .16s, color .16s;
  }
  .settings-btn:hover{ background:var(--surface-hover); color:var(--text); }
  .user-profile{ display:flex; align-items:center; gap:9px; flex:1; padding:4px 6px; border-radius:var(--radius-sm); transition:background .16s; }
  .user-profile:hover{ background:var(--surface-hover); }
  .user-avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,#ff9b71,#c46cff);
    display:flex; align-items:center; justify-content:center;
    font-size:.75rem; font-weight:700; color:#fff;
  }
  .user-meta{ display:flex; flex-direction:column; line-height:1.25; overflow:hidden; }
  .user-meta strong{ font-size:.83rem; font-weight:600; }
  .user-meta span{ font-size:.72rem; color:var(--text-faint); }

  /* ============ MAIN ============ */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }

  .top-header{
    height:60px; flex-shrink:0; display:flex; align-items:center; gap:12px;
    padding:0 20px; border-bottom:1px solid var(--border);
    background:var(--bg);
  }
  .icon-btn{
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius-sm); color:var(--text-muted); flex-shrink:0;
    transition:background .16s, color .16s;
  }
  .icon-btn:hover{ background:var(--surface-hover); color:var(--text); }
  .hamburger{ display:none; }

  .model-select{
    display:flex; align-items:center; gap:8px; padding:8px 12px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    font-size:.86rem; font-weight:600; color:var(--text);
    transition:border-color .16s, background .16s;
  }
  .model-select:hover{ border-color:var(--accent); }
  .model-select select{
    background:none; border:none; color:inherit; font:inherit; cursor:pointer;
    appearance:none; -webkit-appearance:none; padding-right:4px;
  }
  .model-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent2); flex-shrink:0; }

  .header-spacer{ flex:1; }

  .theme-toggle{
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
    transition:background .16s, transform .3s var(--ease);
  }
  .theme-toggle:hover{ color:var(--text); }
  .theme-toggle:active{ transform:rotate(20deg); }

  /* ============ CHAT AREA ============ */
  .chat-scroll{ flex:1; overflow-y:auto; }
  .chat-inner{ max-width:760px; margin:0 auto; padding:28px 20px 12px; }

  /* Empty state */
  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; min-height:calc(100vh - 220px); gap:22px;
    animation:fadeUp .5s var(--ease);
  }
  .empty-glyph{
    width:56px; height:56px; border-radius:16px;
    background:linear-gradient(155deg, var(--accent), var(--accent2));
    position:relative;
  }
  .empty-glyph::after{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.6), transparent 55%);
  }
  .empty-state h1{
    font-family:var(--font-display); font-weight:500; font-style:italic;
    font-size:1.9rem; letter-spacing:.2px;
  }
  .empty-state p{ color:var(--text-muted); font-size:.95rem; max-width:380px; }

  .suggestion-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:560px; margin-top:6px;
  }
  .suggestion-card{
    text-align:left; padding:13px 15px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius-md);
    font-size:.83rem; color:var(--text-muted); line-height:1.4;
    transition:transform .16s var(--ease), border-color .16s, background .16s;
  }
  .suggestion-card strong{ display:block; color:var(--text); font-size:.86rem; margin-bottom:2px; font-weight:600; }
  .suggestion-card:hover{ transform:translateY(-2px); border-color:var(--accent); background:var(--surface-hover); }

  /* Messages */
  .msg-row{ display:flex; gap:12px; margin-bottom:22px; animation:popIn .32s var(--ease); }
  .msg-row.user{ flex-direction:row-reverse; }
  @keyframes popIn{
    from{ opacity:0; transform:translateY(8px) scale(.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .avatar{
    width:30px; height:30px; border-radius:9px; flex-shrink:0; margin-top:2px;
    display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700;
  }
  .avatar.assistant{ background:linear-gradient(155deg, var(--accent), var(--accent2)); color:#fff; }
  .avatar.user{ background:linear-gradient(135deg,#ff9b71,#c46cff); color:#fff; }

  .msg-col{ display:flex; flex-direction:column; max-width:78%; }
  .msg-row.user .msg-col{ align-items:flex-end; }
  .msg-name{ font-size:.72rem; color:var(--text-faint); margin-bottom:5px; font-weight:600; }
  .msg-row.user .msg-name{ text-align:right; }

  .bubble{
    padding:11px 15px; border-radius:var(--radius-lg); font-size:.92rem; line-height:1.58;
    word-wrap:break-word;
  }
  .msg-row.assistant .bubble{
    background:var(--assistant-bubble); border:1px solid var(--border);
    border-top-left-radius:6px; color:var(--text);
  }
  .msg-row.user .bubble{
    background:var(--user-bubble); color:#fff; border-top-right-radius:6px;
  }
  .bubble p + p{ margin-top:10px; }

  /* Code blocks inside bubbles */
  .code-block{
    margin:10px 0; border-radius:10px; overflow:hidden; border:1px solid var(--border);
    background:#0e0f18; font-family:var(--font-mono);
  }
  html[data-theme="light"] .code-block{ background:#20212c; }
  .code-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 12px; background:rgba(255,255,255,.04);
    border-bottom:1px solid rgba(255,255,255,.08);
    font-size:.72rem; color:#a9abc4;
  }
  .copy-btn{
    display:flex; align-items:center; gap:5px; color:#c8cae0; font-size:.72rem;
    padding:3px 7px; border-radius:6px; transition:background .16s;
  }
  .copy-btn:hover{ background:rgba(255,255,255,.08); }
  .copy-btn.copied{ color:var(--accent2); }
  .code-block pre{ padding:13px 15px; overflow-x:auto; font-size:.8rem; color:#e4e5f5; line-height:1.6; }

  /* Signature thinking indicator — orbiting dot, not generic 3-dot bounce */
  .thinking-row{ display:flex; gap:12px; margin-bottom:22px; }
  .thinking-orbit{
    width:30px; height:30px; border-radius:9px; flex-shrink:0; margin-top:2px;
    background:linear-gradient(155deg, var(--accent), var(--accent2));
    position:relative;
  }
  .thinking-orbit .dot{
    position:absolute; width:6px; height:6px; border-radius:50%; background:#fff;
    top:50%; left:50%; margin:-3px;
    animation:orbit 1.1s linear infinite;
  }
  @keyframes orbit{
    from{ transform:rotate(0deg) translateX(11px) rotate(0deg); }
    to{ transform:rotate(360deg) translateX(11px) rotate(-360deg); }
  }
  .thinking-label{ font-size:.83rem; color:var(--text-muted); align-self:center; }

  /* ============ INPUT AREA ============ */
  .input-area{
    flex-shrink:0; border-top:1px solid var(--border);
    background:var(--bg); padding:14px 20px 18px;
  }
  .input-inner{ max-width:760px; margin:0 auto; }
  .input-wrap{
    display:flex; align-items:flex-end; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:8px 8px 8px 12px; transition:border-color .16s, box-shadow .16s;
  }
  .input-wrap:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #messageInput{
    flex:1; border:none; background:none; resize:none; color:var(--text);
    font-family:inherit; font-size:.92rem; line-height:1.5; max-height:180px; padding:7px 0;
  }
  #messageInput::placeholder{ color:var(--text-faint); }

  .attach-btn{
    width:34px; height:34px; flex-shrink:0; border-radius:var(--radius-sm); color:var(--text-muted);
    display:flex; align-items:center; justify-content:center; transition:background .16s, color .16s;
  }
  .attach-btn:hover{ background:var(--surface-hover); color:var(--text); }

  .send-btn{
    width:34px; height:34px; flex-shrink:0; border-radius:50%; background:var(--accent);
    color:var(--accent-text); display:flex; align-items:center; justify-content:center;
    transition:transform .14s var(--ease), opacity .16s;
  }
  .send-btn:hover{ transform:scale(1.06); }
  .send-btn:active{ transform:scale(.94); }
  .send-btn:disabled{ opacity:.4; pointer-events:none; }

  .input-hint{ text-align:center; font-size:.72rem; color:var(--text-faint); margin-top:9px; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 860px){
    .hamburger{ display:flex; }
    .sidebar{
      position:fixed; inset:0 auto 0 0; z-index:40; margin-left:-272px;
      box-shadow:none;
    }
    .sidebar.open{ margin-left:0; box-shadow:0 0 0 100vmax rgba(0,0,0,.4); }
    .suggestion-grid{ grid-template-columns:1fr; }
    .model-select span.model-label{ display:none; }
  }

  .sidebar-scrim{
    display:none;
  }
  @media (max-width:860px){
    .sidebar-scrim{
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:35;
    }
    .sidebar-scrim.show{ display:block; }
  }
</style>
</head>
<body>

<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark"></div>
      <span class="brand-name">Aster</span>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>

    <div class="history-label">Recent</div>
    <nav class="history-list" id="historyList">
      <div class="history-item active">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        New conversation
      </div>
      <div class="history-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Weekend trip itinerary ideas
      </div>
      <div class="history-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Debugging a React re-render
      </div>
      <div class="history-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Explaining quantum entanglement
      </div>
      <div class="history-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Sourdough starter troubleshooting
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="settings-btn" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="user-profile">
        <div class="user-avatar">JK</div>
        <div class="user-meta">
          <strong>Jordan Kim</strong>
          <span>Free plan</span>
        </div>
      </button>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="top-header">
      <button class="icon-btn hamburger" id="hamburgerBtn" aria-label="Toggle sidebar">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>

      <label class="model-select">
        <span class="model-dot"></span>
        <select id="modelPicker" aria-label="Choose model">
          <option>Aster 2.1 — Balanced</option>
          <option>Aster 2.1 — Fast</option>
          <option>Aster Reasoning</option>
        </select>
      </label>

      <div class="header-spacer"></div>

      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg id="themeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
      </button>
    </header>

    <main class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">

        <!-- Empty state (shown before first message) -->
        <div class="empty-state" id="emptyState">
          <div class="empty-glyph"></div>
          <h1>What's on your mind?</h1>
          <p>Ask a question, paste some code, or start from one of these.</p>
          <div class="suggestion-grid">
            <button class="suggestion-card" data-prompt="Explain how async/await works in JavaScript with a short example.">
              <strong>Explain a concept</strong>
              How async/await works in JavaScript
            </button>
            <button class="suggestion-card" data-prompt="Write a Python function that checks if a string is a palindrome.">
              <strong>Write some code</strong>
              A palindrome checker in Python
            </button>
            <button class="suggestion-card" data-prompt="Give me a 3-day itinerary for a first trip to Lisbon.">
              <strong>Plan something</strong>
              A 3-day Lisbon itinerary
            </button>
            <button class="suggestion-card" data-prompt="Help me tighten up this sentence: 'The thing that I want to say is that I think we should probably consider maybe doing this.'">
              <strong>Improve my writing</strong>
              Tighten up a wordy sentence
            </button>
          </div>
        </div>

        <!-- Message thread (populated by JS) -->
        <div id="messageThread"></div>

      </div>
    </main>

    <!-- ============ INPUT AREA ============ -->
    <div class="input-area">
      <div class="input-inner">
        <div class="input-wrap">
          <button class="attach-btn" aria-label="Attach file" title="Attach file">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="messageInput" rows="1" placeholder="Message Aster…"></textarea>
          <button class="send-btn" id="sendBtn" disabled aria-label="Send message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
        <div class="input-hint">Aster can make mistakes. Check important info.</div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ASTER CHAT — vanilla JS interactivity
   Sections: theme, sidebar, textarea, messaging, streaming
   ========================================================= */

(function () {
  'use strict';

  /* ---------- THEME (dark/light, persisted) ---------- */
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');

  const SUN = '<path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="5"/>';
  const MOON = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>';

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    themeIcon.innerHTML = theme === 'dark' ? MOON : SUN;
    localStorage.setItem('aster-theme', theme);
  }
  applyTheme(localStorage.getItem('aster-theme') || 'dark');

  themeToggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });

  /* ---------- SIDEBAR (mobile collapse) ---------- */
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('sidebarScrim');
  const hamburgerBtn = document.getElementById('hamburgerBtn');

  function openSidebar() { sidebar.classList.add('open'); scrim.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); scrim.classList.remove('show'); }

  hamburgerBtn.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  scrim.addEventListener('click', closeSidebar);

  /* ---------- ELEMENTS ---------- */
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const emptyState = document.getElementById('emptyState');
  const messageThread = document.getElementById('messageThread');
  const chatScroll = document.getElementById('chatScroll');
  const newChatBtn = document.getElementById('newChatBtn');
  const historyList = document.getElementById('historyList');

  /* ---------- AUTO-RESIZING TEXTAREA ---------- */
  function resizeTextarea() {
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 180) + 'px';
    sendBtn.disabled = messageInput.value.trim().length === 0;
  }
  messageInput.addEventListener('input', resizeTextarea);

  // Enter to send, Shift+Enter for a newline
  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  /* ---------- QUICK SUGGESTION CARDS ---------- */
  document.querySelectorAll('.suggestion-card').forEach(card => {
    card.addEventListener('click', () => {
      messageInput.value = card.dataset.prompt;
      resizeTextarea();
      messageInput.focus();
    });
  });

  /* ---------- NEW CHAT ---------- */
  newChatBtn.addEventListener('click', () => {
    // If there was an active conversation, drop it into history first
    if (messageThread.children.length > 0) {
      const firstUserMsg = messageThread.querySelector('.msg-row.user .bubble');
      addHistoryItem(firstUserMsg ? firstUserMsg.textContent.slice(0, 34) : 'New conversation');
    }
    messageThread.innerHTML = '';
    emptyState.style.display = 'flex';
    messageInput.value = '';
    resizeTextarea();
    closeSidebar();
  });

  function addHistoryItem(label) {
    document.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
    const item = document.createElement('div');
    item.className = 'history-item active';
    item.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${label}…`;
    historyList.prepend(item);
  }

  /* ---------- SEND FLOW ---------- */
  sendBtn.addEventListener('click', handleSend);

  function handleSend() {
    const text = messageInput.value.trim();
    if (!text) return;

    if (emptyState.style.display !== 'none') emptyState.style.display = 'none';

    appendUserMessage(text);
    messageInput.value = '';
    resizeTextarea();
    scrollToBottom();

    showThinking();
    // Simulate network/model latency before the reply begins streaming
    const delay = 700 + Math.random() * 600;
    setTimeout(() => {
      hideThinking();
      streamAssistantReply(buildReply(text));
    }, delay);
  }

  function appendUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="avatar user">JK</div>
      <div class="msg-col">
        <span class="msg-name">You</span>
        <div class="bubble">${escapeHtml(text)}</div>
      </div>`;
    messageThread.appendChild(row);
  }

  /* ---------- THINKING INDICATOR (signature element) ---------- */
  let thinkingEl = null;
  function showThinking() {
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'thinking-row';
    thinkingEl.innerHTML = `
      <div class="thinking-orbit"><div class="dot"></div></div>
      <span class="thinking-label">Aster is thinking…</span>`;
    messageThread.appendChild(thinkingEl);
    scrollToBottom();
  }
  function hideThinking() {
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  /* ---------- BUILD A SIMULATED REPLY ---------- */
  // Returns an array of "segments" — plain text or code — to stream in order.
  function buildReply(userText) {
    const lower = userText.toLowerCase();

    if (lower.includes('palindrome') || lower.includes('code') || lower.includes('function')) {
      return [
        { type: 'text', content: "Sure — here's a simple approach. It normalizes the string, then compares it to its reverse:" },
        { type: 'code', lang: 'python', content:
`def is_palindrome(s: str) -> bool:
    cleaned = ''.join(ch.lower() for ch in s if ch.isalnum())
    return cleaned == cleaned[::-1]

print(is_palindrome("A man, a plan, a canal: Panama"))  # True
print(is_palindrome("Not one"))                          # False` },
        { type: 'text', content: "It strips out spaces and punctuation first, so phrases with mixed casing still work correctly. Want a version that also reports the mismatched index?" }
      ];
    }

    if (lower.includes('async') || lower.includes('await')) {
      return [
        { type: 'text', content: "`async/await` is syntax sugar over promises — it lets asynchronous code read top-to-bottom like synchronous code:" },
        { type: 'code', lang: 'javascript', content:
`async function getUser(id) {
  const res = await fetch(\`/api/users/\${id}\`);
  if (!res.ok) throw new Error('Request failed');
  return res.json();
}

getUser(42).then(user => console.log(user.name));` },
        { type: 'text', content: "The function pauses at each `await` without blocking the rest of the app, and any thrown error can be caught with a regular try/catch." }
      ];
    }

    if (lower.includes('lisbon') || lower.includes('itinerary') || lower.includes('trip')) {
      return [
        { type: 'text', content: "Here's a relaxed first-timer's take on three days in Lisbon:" },
        { type: 'text', content: "Day 1 — Alfama and the castle: wander the old lanes, catch the sunset from Miradouro das Portas do Sol.\nDay 2 — Belém: the tower, the monastery, and an obligatory pastel de nata stop.\nDay 3 — Bairro Alto by day, Time Out Market for lunch, and fado in the evening." },
        { type: 'text', content: "Want me to add restaurant picks or a day trip to Sintra?" }
      ];
    }

    // Generic fallback reply
    return [
      { type: 'text', content: "Here's a quick take on that." },
      { type: 'text', content: "I've simulated this response client-side since there's no model connected yet — but this is exactly where a real streamed reply from the API would land, word by word." },
      { type: 'text', content: "Ask me something else, or try one of the starter prompts next time you open a new chat." }
    ];
  }

  /* ---------- STREAM THE REPLY INTO A BUBBLE ---------- */
  function streamAssistantReply(segments) {
    const row = document.createElement('div');
    row.className = 'msg-row assistant';
    row.innerHTML = `
      <div class="avatar assistant">✦</div>
      <div class="msg-col">
        <span class="msg-name">Aster</span>
        <div class="bubble" id="streamBubble"></div>
      </div>`;
    messageThread.appendChild(row);
    const bubble = row.querySelector('#streamBubble');
    scrollToBottom();

    let segIndex = 0;
    let currentP = null;

    function nextSegment() {
      if (segIndex >= segments.length) return; // done
      const seg = segments[segIndex++];

      if (seg.type === 'code') {
        renderCodeBlock(bubble, seg.lang, seg.content);
        currentP = null;
        scrollToBottom();
        setTimeout(nextSegment, 260); // brief pause after a code block
        return;
      }

      // Plain text: stream word by word into a new <p>
      currentP = document.createElement('p');
      bubble.appendChild(currentP);
      const words = seg.content.split(' ');
      let i = 0;
      const interval = setInterval(() => {
        currentP.textContent += (i === 0 ? '' : ' ') + words[i];
        i++;
        scrollToBottom();
        if (i >= words.length) {
          clearInterval(interval);
          setTimeout(nextSegment, 180);
        }
      }, 32);
    }

    nextSegment();
  }

  function renderCodeBlock(container, lang, code) {
    const block = document.createElement('div');
    block.className = 'code-block';
    block.innerHTML = `
      <div class="code-head">
        <span>${escapeHtml(lang)}</span>
        <button class="copy-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span class="copy-label">Copy code</span>
        </button>
      </div>
      <pre><code>${escapeHtml(code)}</code></pre>`;
    container.appendChild(block);

    block.querySelector('.copy-btn').addEventListener('click', function () {
      navigator.clipboard.writeText(code).then(() => {
        this.classList.add('copied');
        this.querySelector('.copy-label').textContent = 'Copied!';
        setTimeout(() => {
          this.classList.remove('copied');
          this.querySelector('.copy-label').textContent = 'Copy code';
        }, 1800);
      });
    });
  }

  /* ---------- UTILITIES ---------- */
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function scrollToBottom() {
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

})();
</script>
</body>
</html>
